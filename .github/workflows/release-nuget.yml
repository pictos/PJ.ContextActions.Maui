# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Create a release on NuGet

on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"

env:
    LIB_CSPROJ: src/PJ.ContextActions.Maui/PJ.ContextActions.Maui.csproj
    PACKAGE_NAME: PJSouzaSoftware.ContextActions.Maui

jobs:
  release-nuget:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4
    - name: Verify commit exists in origin/main
      run: |
        git fetch --no-tags --prune --depth=1 origin +refs/heads/*:refs/remotes/origin/*
        git branch --remote --contains | grep origin/main

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.402

    - name: Workload install
      run: |
        dotnet workload install maui
        dotnet workload install maui-windows
        dotnet workload update

    - name: Get version information tag
      id: get_version
      uses: battila7/get-version-action@v2
    - name: Pack
      run: dotnet pack ${{env.LIB_CSPROJ}} -c Release -p:PackageVersion=${{steps.get_version.outputs.version-without-v}} -o . --include-symbols --include-source
    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: PedroJesus
    - name: Publish
      env:
        API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: |
        dotnet nuget push ${{env.PACKAGE_NAME}}.${{ steps.get_version.outputs.version-without-v }}.nupkg --api-key "$env:API_KEY" --source https://api.nuget.org/v3/index.json
